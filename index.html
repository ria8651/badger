<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Badger</title>
    <script>
      // Before first paint, so the page doesn't flash another theme. src/theme.ts takes over after.
      {
        const raw = localStorage.getItem('badger.theme')
        const c = { mode: 'system', frame: 'classic' }
        if (raw === 'light' || raw === 'dark') c.mode = raw
        else try { Object.assign(c, JSON.parse(raw || '{}')) } catch {}
        const palette = c.mode === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : c.mode
        const root = document.documentElement
        root.dataset.palette = palette
        root.dataset.frame = c.frame
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
