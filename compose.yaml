services:
  badger:
    # Published by .github/workflows/image.yml; `--build` builds it from here instead.
    image: ghcr.io/ria8651/badger:latest
    build: .
    container_name: badger
    restart: unless-stopped
    # No auth of its own: only expose this to the auth proxy in front of it.
    ports:
      - 3001:3001
    # Transcripts, database, Claude/git/gh logins, repos.
    volumes:
      - ${BADGER_DIR:-./badger}:/badger
    # Whoever owns BADGER_DIR.
    # user: 1000:1000
