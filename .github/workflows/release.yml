name: Release

# Run by hand from the Actions tab: picks the next version from the latest v* tag (0.1.0 if there's none), builds
# Badger.app from the default branch, publishes it as a GitHub release, which tags that commit, then the Docker image
# for the same commit (see image.yml). Tags are where versions live: nothing is committed, and package.json's
# version is only set in the build. The app is signed with the SIGNING_CERT_P12 secret (see scripts/make-cert.sh).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version goes up
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: next
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$last" ]; then
            next=0.1.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              patch) next="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "${last:-no release yet} → v$next" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$next" >> "$GITHUB_OUTPUT"
        env:
          BUMP: ${{ inputs.bump }}

  macos:
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # The Node the app bundles (scripts/build-app.mjs), so its dependencies are installed by the same one.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - run: pnpm install --frozen-lockfile

      - run: npm pkg set version="$VERSION"

      # The certificate scripts/make-cert.sh made, in a keychain of its own. Its password is make-cert.sh's fixed one.
      - name: Import the signing certificate
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::error::SIGNING_CERT_P12 isn't set (see scripts/make-cert.sh). Signed ad-hoc, every update would ask for its permissions again."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P badger -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - run: pnpm app:build --release --dmg

      - name: Check it's signed with the certificate
        working-directory: app/target/release/bundle
        run: |
          if codesign -dv macos/Badger.app 2>&1 | grep -q 'Signature=adhoc'; then
            echo "::error::Badger.app is signed ad-hoc; refusing to release it."
            exit 1
          fi
          codesign -d --requirements - macos/Badger.app 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Zip the app too
        working-directory: app/target/release/bundle
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          ditto -c -k --sequesterRsrc --keepParent macos/Badger.app "$RUNNER_TEMP/out/Badger_${VERSION}_aarch64.app.zip"
          cp dmg/*.dmg "$RUNNER_TEMP/out/"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, macos]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: out

      - name: Publish the release, tagging the commit it was built from
        run: |
          cat > notes.md <<'EOF'
          **macOS (Apple Silicon):** download the `.dmg` and drag Badger to Applications. It's self-signed, not notarised by Apple, so macOS won't open it the first time: open it once, then **System Settings → Privacy & Security → Open Anyway**. Updates keep what you've allowed it.

          **Docker:** `ghcr.io/${{ github.repository_owner }}/badger:${{ env.VERSION }}`, once the image job below finishes.
          EOF
          gh release create "v$VERSION" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file notes.md \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A tag pushed by this workflow's token doesn't start image.yml, so it's called here instead.
  image:
    needs: [version, publish]
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
